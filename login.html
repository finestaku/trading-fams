<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - Crypto Demo Trader</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .login-box {
      max-width: 360px;
      margin: 80px auto;
      padding: 30px;
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.15);
    }
    .login-box h2 { margin-top: 0; text-align: center; }
    .login-box input {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 15px;
      box-sizing: border-box;
    }
    .login-box button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: #2ecc71;
      color: white;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      margin-bottom: 10px;
    }
    .login-box .secondary-btn { background: #3498db; }
    #loginError { color: #e74c3c; font-size: 14px; text-align: center; }
  </style>
</head>
<body>

  <div class="login-box">
    <h2>Crypto Demo Trader</h2>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button id="loginBtn">Log In</button>
    <button id="signupBtn" class="secondary-btn">Sign Up</button>
    <p id="loginError"></p>
  </div>

  <script>
    const API = 'http://localhost:3000';

    async function attempt(endpoint) {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('loginError');
      errorEl.textContent = '';

      try {
        const res = await fetch(`${API}/${endpoint}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (data.userId) {
          localStorage.setItem('userId', data.userId);
          localStorage.setItem('username', username);
          window.location.href = 'trading.html';
        } else {
          errorEl.textContent = data.error || 'Something went wrong';
        }
      } catch (err) {
        errorEl.textContent = 'Could not reach server. Is your backend running?';
      }
    }

    document.getElementById('loginBtn').addEventListener('click', () => attempt('api/login'));
    document.getElementById('signupBtn').addEventListener('click', () => attempt('api/signup'));
  </script>

</body>
</html>
