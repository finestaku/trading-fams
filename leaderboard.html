<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaderboard - Crypto Global Trade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav>
    <div class="logo">Crypto Global Trade</div>
    <button class="hamburger" id="hamburgerBtn">☰</button>
    <div class="nav-menu" id="navMenu">
      <a href="index.html" data-i18n="nav_home">Home</a>
      <a href="trading.html" data-i18n="nav_trading">Trading</a>
      <a href="leaderboard.html" data-i18n="nav_leaderboard">Leaderboard</a>
      <a href="about.html" data-i18n="nav_about">About</a>
      <div id="authSlot"></div>
      <div style="padding: 14px 20px; border-top: 1px solid rgba(255,255,255,0.1);">
        <select id="langSelect" style="width: 100%; padding: 6px; border-radius: 6px;"></select>
      </div>
    </div>
  </nav>

  <div class="page-content">
    <div class="card">
      <h2 data-i18n="leaderboard_title">Your Best Score</h2>
      <p style="font-size: 32px; font-weight: bold; color: var(--accent);">
        $<span id="bestScoreDisplay">0.00</span>
      </p>
      <p data-i18n="leaderboard_desc">This is the highest profit you've reached while trading. Beat it on the Trading page!</p>
    </div>
  </div>

  <script src="nav.js"></script>
  <script src="i18n.js"></script>
  <script>
    const best = Number(localStorage.getItem('bestScore')) || 0;
    document.getElementById('bestScoreDisplay').textContent = best.toFixed(2);
  </script>
</body>
</html>
