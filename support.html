<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Support - Crypto Global Trade</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .support-box {
      max-width: 500px;
      margin: 50px auto;
      padding: 0 20px;
    }
    .support-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.12);
      margin-bottom: 20px;
    }
    .support-card h3 { margin-top: 0; }
    .support-card input, .support-card textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
      box-sizing: border-box;
      font-family: inherit;
    }
    .support-card textarea { min-height: 100px; }
    .support-card button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: #2ecc71;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }
    #supportMsg { font-size: 13px; text-align: center; margin-top: 10px; }
    .help-note {
      font-size: 13px;
      color: var(--muted);
      text-align: center;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <nav>
    <div class="logo">Crypto Global Trade</div>
    <button class="hamburger" id="hamburgerBtn">☰</button>
    <div class="nav-menu" id="navMenu">
      <a href="index.html">Home</a>
      <a href="trading.html">Trading</a>
      <a href="wallet.html">Wallet</a>
      <a href="leaderboard.html">Leaderboard</a>
      <a href="support.html">Support</a>
      <a href="about.html">About</a>
    </div>
  </nav>

  <div class="support-box">
    <p class="help-note">Lost access to your account? Send a message below and an admin can help reset your password.</p>

    <div class="support-card">
      <h3>Contact Support</h3>
      <input type="text" id="supportName" placeholder="Your name">
      <input type="email" id="supportEmail" placeholder="Your email">
      <textarea id="supportMessage" placeholder="How can we help?"></textarea>
      <button id="supportBtn">Send Message</button>
      <p id="supportMsg"></p>
    </div>
  </div>

  <script src="nav.js"></script>
  <script>
    const API = 'http://localhost:3000';

    async function sendSupport() {
      const name = document.getElementById('supportName').value;
      const email = document.getElementById('supportEmail').value;
      const message = document.getElementById('supportMessage').value;
      const msgEl = document.getElementById('supportMsg');

      const res = await fetch(`${API}/api/support`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, message })
      });
      const data = await res.json();

      if (data.success) {
        msgEl.style.color = '#2ecc71';
        msgEl.textContent = 'Message sent! Support will get back to you.';
        document.getElementById('supportMessage').value = '';
      } else {
        msgEl.style.color = '#e74c3c';
        msgEl.textContent = 'Something went wrong.';
      }
    }

    document.getElementById('supportBtn').addEventListener('click', sendSupport);
  </script>

</body>
</html>
