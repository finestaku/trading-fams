<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin - Crypto Demo Trader</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .admin-box {
      max-width: 500px;
      margin: 60px auto;
      padding: 30px;
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.15);
    }
    .admin-box h2 { margin-top: 0; }
    .admin-box label { display: block; font-size: 14px; font-weight: 600; margin: 14px 0 6px 0; }
    .admin-box input, .admin-box textarea {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
      box-sizing: border-box;
      font-family: inherit;
    }
    .admin-box textarea { min-height: 80px; }
    .admin-box button {
      margin-top: 18px;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: #2ecc71;
      color: white;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }
    #adminMsg { font-size: 14px; margin-top: 10px; text-align: center; }
  </style>
</head>
<body>

  <div class="admin-box">
    <h2>Site Admin</h2>

    <label>Admin Password</label>
    <input type="password" id="adminPassword" placeholder="Enter admin password">

    <label>Hero Title</label>
    <input type="text" id="heroTitle">

    <label>Hero Description</label>
    <textarea id="heroDesc"></textarea>

    <label>Hero Button Text</label>
    <input type="text" id="heroBtn">

    <button id="saveBtn">Save Changes</button>
    <p id="adminMsg"></p>
  </div>

  <script>
    const API = 'http://localhost:3000';

    async function loadContent() {
      try {
        const res = await fetch(`${API}/api/content`);
        const data = await res.json();
        document.getElementById('heroTitle').value = data.hero_title;
        document.getElementById('heroDesc').value = data.hero_desc;
        document.getElementById('heroBtn').value = data.hero_btn;
      } catch (err) {
        document.getElementById('adminMsg').textContent = 'Could not reach backend.';
      }
    }

    async function saveContent() {
      const msgEl = document.getElementById('adminMsg');
      msgEl.textContent = '';

      const body = {
        password: document.getElementById('adminPassword').value,
        hero_title: document.getElementById('heroTitle').value,
        hero_desc: document.getElementById('heroDesc').value,
        hero_btn: document.getElementById('heroBtn').value
      };

      try {
        const res = await fetch(`${API}/api/content`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        if (data.success) {
          msgEl.style.color = '#2ecc71';
          msgEl.textContent = 'Saved! Refresh the homepage to see changes.';
        } else {
          msgEl.style.color = '#e74c3c';
          msgEl.textContent = data.error || 'Something went wrong.';
        }
      } catch (err) {
        msgEl.style.color = '#e74c3c';
        msgEl.textContent = 'Could not reach backend.';
      }
    }

    document.getElementById('saveBtn').addEventListener('click', saveContent);
    loadContent();
  </script>

</body>
</html>
